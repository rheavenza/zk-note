[workspace]
resolver = "2"
members = [
    "crates/zk-protocol",
    "crates/zk-crypto",
    "crates/zk-core",
    "crates/zk-storage",
    "crates/zk-sync",
    "apps/cli",
    "apps/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Zero-Knowledge Notes Team"]

# Dependency direction:
# zk-protocol (bottom of stack, wire protocol & constants)
#    ↑
# zk-crypto (cryptographic primitives & envelope formats)
#    ↑
# zk-core (domain note model & vault orchestration)
#    ↑
# zk-storage (storage traits; depends on zk-protocol)
#    ↑
# zk-sync (sync state machine & conflict merge; depends on zk-core, zk-crypto, zk-protocol, zk-storage)
#    ↑
# apps/cli (depends on zk-core, zk-crypto, zk-protocol, zk-storage, zk-sync)
# apps/server (depends on zk-protocol only - server has no crypto/plaintext keys)

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[workspace.dependencies]
zk-protocol = { path = "crates/zk-protocol" }
zk-crypto = { path = "crates/zk-crypto" }
zk-core = { path = "crates/zk-core" }
zk-storage = { path = "crates/zk-storage" }
zk-sync = { path = "crates/zk-sync" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"
rand_core = { version = "0.6", features = ["getrandom"] }
argon2 = "0.5"
base64ct = { version = "1.8", features = ["alloc"] }
chacha20poly1305 = "0.10"
blake2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
rpassword = "7.3"
uuid = { version = "1.8", features = ["v4", "serde"] }

tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "net", "signal", "io-util"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
