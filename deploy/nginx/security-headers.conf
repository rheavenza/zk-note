# ==============================================================================
# Browser Security Headers Configuration (ZK-069)
# ==============================================================================
# In accordance with MASTER_SPEC.md § 18, SEC-001, SEC-002, and SEC-003:
# - Strictly restricts script execution to the application origin + WebAssembly linear memory.
# - Zero third-party scripts, CDNs, or external runtime trackers.
# - Hardened against Clickjacking, MIME-sniffing, Spectre, and data exfiltration.

# 1. Content Security Policy (CSP)
add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;" always;

# 2. Clickjacking Protection (defense-in-depth alongside frame-ancestors)
add_header X-Frame-Options "DENY" always;

# 3. MIME-Type Sniffing Protection
add_header X-Content-Type-Options "nosniff" always;

# 4. Strict Referrer Policy (prevent query parameter or path leakage)
add_header Referrer-Policy "no-referrer" always;

# 5. Cross-Origin Browsing Context Isolation (Spectre / WASM linear memory security)
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# 6. Hardware & Sensor Permissions Lock-down
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# 7. HTTP Strict Transport Security (HSTS) - 2 years + subdomains + preload
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
