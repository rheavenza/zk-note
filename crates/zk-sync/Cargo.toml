[package]
name = "zk-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Synchronization engine, mutation queues, conflict detection, and merge algorithms"

[lints]
workspace = true

[features]
default = ["native-adapter"]
native-adapter = ["dep:reqwest", "dep:tokio", "zk-storage/sqlite"]

[dependencies]
zk-core = { workspace = true }
zk-crypto = { workspace = true }
zk-protocol = { workspace = true }
zk-storage = { workspace = true, default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
uuid = { workspace = true }

