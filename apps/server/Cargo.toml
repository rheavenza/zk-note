[package]
name = "zk-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Zero-knowledge ciphertext store and sync coordination server"

[lib]
name = "zk_server"
path = "src/lib.rs"

[[bin]]
name = "zk-server"
path = "src/main.rs"


[lints]
workspace = true

[dependencies]
zk-server-auth = { path = "../../crates/zk-server-auth" }
zk-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
rusqlite = { workspace = true }
base64ct = { workspace = true }
blake2 = { workspace = true }

[dev-dependencies]
zk-sync = { workspace = true }
zk-core = { workspace = true }
zk-crypto = { workspace = true }
zk-storage = { workspace = true }




p256 = { version = "0.13.2", features = ["ecdsa"] }
sha2 = "0.10.9"
ciborium = "0.2.2"
